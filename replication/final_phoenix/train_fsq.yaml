seed: 42
weight_dtype: fp32
stage_init: true
distill_loss_weight: 1

modules:
  vae: /SLURM/home/slurm_s202281480/karsl/DiffSynth-Studio/signvip/checkpoints/RWTH/vae
  unet_2d: /SLURM/home/slurm_s202281480/karsl/DiffSynth-Studio/signvip/checkpoints/RWTH/unet
  scheduler: /SLURM/home/slurm_s202281480/karsl/DiffSynth-Studio/signvip/checkpoints/RWTH/scheduler
  apperance_encoder: /SLURM/home/slurm_s202281480/karsl/DiffSynth-Studio/signvip/checkpoints/RWTH/appearance_encoder
  condition_encoder: null
  condition_encoder_motion: null
  vq_model: null
  mm: null
  unet: /SLURM/home/slurm_s202281480/karsl/DiffSynth-Studio/signvip/checkpoints/RWTH/unet_with_mm.bin
  empty_text_emb: /SLURM/home/slurm_s202281480/karsl/DiffSynth-Studio/signvip/checkpoints/RWTH/empty_text_emb.pt
  condition_encoder_kwargs:
    use_vq: true
    vq_kwargs:
      n_e: 625
      vq_type: FSQ
      fsq_levels: [5, 5, 5, 5]
      quantizer_channels: 4
      ch_mult: [1, 2, 4, 8]
      input_size: [34, 28]
  unet_additional_kwargs:
    use_motion_module: true
    motion_module_resolutions: [1, 2, 4, 8]
    unet_use_cross_frame_attention: false
    unet_use_temporal_attention: false
    motion_module_type: Vanilla
    motion_module_kwargs:
      num_attention_heads: 8
      num_transformer_block: 1
      attention_block_types: [Temporal_Self, Temporal_Self]
      temporal_position_encoding: true
      temporal_position_encoding_max_len: 32
      temporal_attention_dim_div: 1
      zero_initialize: true

grad:
  vae: false
  unet_2d: false
  appearance_encoder: false
  text_encoder: false
  condition_encoder: false
trainable_modules: [vq.]
gradient_checkpointing: false

solver:
  max_train_steps: 50000
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer:
    use_8bit_adam: false
    learning_rate: 5.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_weight_decay: 0
    adam_epsilon: 1.0e-8
  lr_scheduler:
    name: cosine
    lr_warmup_steps: 500
    num_cycles: 0.5

dataset:
  frame_size: [272, 224]
  frame_scale: [1.0, 1.0]
  frame_ratio: [0.9, 1.0]
  roots:
    - /SLURM/home/slurm_s202281480/karsl/DiffSynth-Studio/signvip_dit/data/phoenix2014t/rgb
  sk_roots:
    - /SLURM/home/slurm_s202281480/karsl/DiffSynth-Studio/signvip_dit/data/phoenix2014t/dwpose
  hamer_roots:
    - /SLURM/home/slurm_s202281480/karsl/DiffSynth-Studio/signvip_dit/data/phoenix2014t/hamer
  meta_paths:
    - /SLURM/home/slurm_s202281480/karsl/DiffSynth-Studio/signvip_dit/data/phoenix2014t/train_meta.json
  sample_rate: 2
  num_frames: 4
  ref_margin: 1
  uncond_ratio: 1
  mask_ratio: 0
  mask_thershold: 0.85
  skip_ratio: 0
  sk_mask_ratio: 0
  hamer_mask_ratio: 0
  both_mask_ratio: 0

dataloader:
  # Two processes x eight examples = the paper's global batch of 16.
  batch_size: 8
  num_workers: 4

resume_from_checkpoint: null
checkpointing_steps: 10000
valid_steps: 10000
max_ckpt: 1
max_model: 5

noise_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: scaled_linear
  steps_offset: 1
  clip_sample: false

noise_offset: 0
clip_skip: 1
snr_gamma: 0
max_visible_frames: 6

validation_data:
  meta_paths:
    - /SLURM/home/slurm_s202281480/karsl/DiffSynth-Studio/signvip_dit/data/phoenix2014t/dev_meta.json
  prompt: ""
  num_inference_steps: 50
  guidance_scale: 3.5
